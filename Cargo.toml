[package]
name = "sentrix-grpc-wasm"
version = "0.1.0-alpha.0"
edition = "2021"
license = "MIT"
description = "Rust + WASM gRPC-Web client for Sentrix Chain. Extracted from sentrix-explorer-v2; usable from any browser dApp via wasm-pack."
homepage = "https://sentrixchain.com"
repository = "https://github.com/Sentriscloud/sentrix-grpc-wasm"
keywords = ["sentrix", "sentrixchain", "grpc-web", "wasm", "blockchain"]
categories = ["wasm", "api-bindings", "web-programming"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tonic = { version = "0.12", default-features = false, features = ["prost", "codegen"] }
tonic-web-wasm-client = "0.6"
prost = "0.14"
hex = "0.4"

[build-dependencies]
tonic-build = { version = "0.12", default-features = false, features = ["prost"] }

[lints.rust]
unsafe_code = "forbid"
